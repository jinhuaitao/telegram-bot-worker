name = "tg-multibot"
main = "src/index.js"
compatibility_date = "2025-04-01"

# ── 定时触发器 ───────────────────────────────────────────────
# 每分钟唤醒一次，负责：提醒派发、监控探活、天气定时推送
[triggers]
crons = ["* * * * *"]

# ── KV 存储（存订阅 / 监控项 / 提醒 / 用户设置）─────────────
#
# 这里故意不写 id —— 用的是 Wrangler 的「自动预置」特性：
# 部署时会自动创建一个名为 <worker名>-BOT_KV 的 KV 命名空间。
# 所以无论走「面板连 GitHub」还是「本地 CLI」，都不需要先手动创建资源。
#
# 想复用已有的 KV，就取消下面这行注释并填上自己的命名空间 ID
# （面板路径：Workers & Pages → KV → 选中命名空间 → 复制 ID）：
#
#   id = "a1b2c3d4e5f60718293a4b5c6d7e8f90"
#
[[kv_namespaces]]
binding = "BOT_KV"

# ── Workers AI（翻译用）──────────────────────────────────────
#
# 绑定后 /tr 会优先用 Cloudflare 自家的 m2m100 翻译模型，
# 不再依赖 Google 的公开端点，也就不会遇到 429 限流。
#
# 免费额度：10000 neurons/天。翻译 100 字大约消耗 6 neurons，
# 折算下来每天能翻 1500 次左右，个人使用绰绰有余。
#
# 如果你的账号暂时用不了 Workers AI（部署时报错），
# 把下面两行注释掉即可 —— 翻译会自动降级到 Google / MyMemory。
[ai]
binding = "AI"

# ── 普通环境变量（非敏感，会随代码一起提交）─────────────────
[vars]
DEFAULT_TZ = "Asia/Shanghai"

# 翻译源优先级。auto = 自动排序（绑了 AI 就 AI 优先，否则 Google 优先），
# 任何一个源限流或报错都会自动降级到下一个，不会把错误抛给用户。
# 也可以填 google / mymemory / ai 把某个源强制提到最前面。
TRANSLATE_PROVIDER = "auto"

# 单次 cron 最多检查多少个监控项，防止 subrequest 超限
MAX_MONITOR_PER_TICK = "20"

# 可选：填上你的邮箱，MyMemory 的免费额度会从 5000 字/天 提到 50000 字/天
# MYMEMORY_EMAIL = "you@example.com"

# ── 敏感变量（密钥）──────────────────────────────────────────
# 下面这两个不要写在这里，它们是密钥：
#
#   · 面板连 GitHub 部署 → 在 Worker 的 Settings → Variables & Secrets
#     里添加，类型选 Secret；保存后重新部署一次才生效
#   · 本地 CLI 部署 → npx wrangler secret put BOT_TOKEN
#                     npx wrangler secret put WEBHOOK_SECRET
#
# BOT_TOKEN      ：从 @BotFather 拿到的机器人 Token
# WEBHOOK_SECRET ：自己生成的一串随机字符，用于校验 Webhook 请求来源
